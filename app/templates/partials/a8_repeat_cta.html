{# Compact text-only A8 CTA repeat — no second impression pixel. #}
{% if a8_repeat_banners %}
<aside class="a8-banners a8-repeat affiliate-box affiliate-box--a8"
       role="complementary"
       aria-label="{{ '제휴 링크' if current_lang == 'kr' else 'Affiliate links' }}">
    {% if a8_repeat_title %}
    <p class="affiliate-box__title">{{ a8_repeat_title }}</p>
    {% endif %}
    <div class="a8-banners__grid">
        {% for banner in a8_repeat_banners %}
        <div class="a8-banners__item a8-banners__item--{{ banner.id }}">
            <a class="a8-banners__link"
               href="{{ banner.click_url }}"
               target="_blank"
               rel="nofollow sponsored noopener noreferrer"
               title="{{ banner.label }}{% if banner.desc %} — {{ banner.desc }}{% endif %}"
               data-track="affiliate_a8"
               data-track-label="{{ banner.id }}-repeat">
                <span class="a8-banners__label">{{ banner.label }}</span>
                {% if banner.desc %}
                <span class="a8-banners__desc">{{ banner.desc }}</span>
                {% endif %}
            </a>
        </div>
        {% endfor %}
    </div>
</aside>
{% endif %}
